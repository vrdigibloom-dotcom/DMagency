<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free PDF Editor</title>

    <link rel="stylesheet" href="style.css">

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
            type="module"></script>

    <!-- pdf-lib -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>

<body>

<header class="topbar">

    <div class="logo">
        PDF<span>Editor</span>
    </div>

    <div class="toolbar">

        <button id="openBtn">
            📂 Open PDF
        </button>

        <button id="textBtn">
            T Text
        </button>

        <button id="imageBtn">
            🖼 Image
        </button>

        <button id="drawBtn">
            ✏ Draw
        </button>

        <button id="whiteoutBtn">
            ⬜ Whiteout
        </button>

        <button id="undoBtn">
            ↶ Undo
        </button>

        <button id="downloadBtn" class="download">
            ⬇ Download PDF
        </button>

    </div>

</header>


<input
    type="file"
    id="pdfInput"
    accept="application/pdf"
    hidden
>


<input
    type="file"
    id="imageInput"
    accept="image/png,image/jpeg,image/webp"
    hidden
>


<main>

    <aside class="sidebar">

        <h3>Pages</h3>

        <div id="pageList"></div>

    </aside>


    <section class="workspace">

        <div id="emptyState">

            <div class="upload-icon">
                📄
            </div>

            <h1>Edit your PDF</h1>

            <p>
                Upload a PDF and edit it directly in your browser.
            </p>

            <button id="startBtn">
                Choose PDF
            </button>

            <small>
                Your file stays on your device.
            </small>

        </div>


        <div id="editor" class="editor hidden">

            <div id="canvasContainer">

                <canvas id="pdfCanvas"></canvas>

                <canvas id="drawingCanvas"></canvas>

                <div id="elementsLayer"></div>

            </div>

        </div>

    </section>

</main>


<script type="module" src="app.js"></script>

</body>
</html>
